name: Verificar

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Tipos, lint, pruebas (dominio y backend con convex-test) y build. No necesita secretos.
      - run: npm run verify
      # El arranque de la Jetson se prueba aparte con Python 3 (stdlib), sin placa ni descargas.
      - run: npm run test:jetson
